<svg width="104" height="104" viewBox="0 0 104 104" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="head" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(42 24) rotate(45) scale(36)">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.14" stop-color="#9EE6FF"/>
      <stop offset="0.58" stop-color="#299EF3"/>
      <stop offset="1" stop-color="#0B4F9F"/>
    </radialGradient>

    <linearGradient id="body" x1="30" y1="43" x2="75" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9EE6FF"/>
      <stop offset="0.34" stop-color="#299EF3"/>
      <stop offset="0.78" stop-color="#299EF3"/>
      <stop offset="1" stop-color="#0B4F9F"/>
    </linearGradient>

    <linearGradient id="baseTop" x1="17" y1="76" x2="86" y2="89" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9EE6FF"/>
      <stop offset="0.46" stop-color="#299EF3"/>
      <stop offset="1" stop-color="#0B4F9F"/>
    </linearGradient>

    <linearGradient id="baseFront" x1="18" y1="84" x2="84" y2="101" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#299EF3"/>
      <stop offset="0.62" stop-color="#0B4F9F"/>
      <stop offset="1" stop-color="#06366E"/>
    </linearGradient>

    <filter id="shadow" x="-35%" y="-60%" width="170%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- soft contact shadow: wide and low, like the reference camera angle -->
  <ellipse cx="52" cy="97.5" rx="37" ry="5.8"
    fill="#00111F" fill-opacity="0.24" filter="url(#shadow)"/>

  <!-- thick front-facing base -->
  <path d="M15 83
           C15 75 31 70 52 70
           C73 70 89 75 89 83
           L89 91
           C89 99 74 103 52 103
           C30 103 15 99 15 91Z"
        fill="url(#baseFront)" stroke="#06366E" stroke-width="1.5"/>

  <ellipse cx="52" cy="81.5" rx="37" ry="12.5"
    fill="url(#baseTop)" stroke="#06366E" stroke-width="1.5"/>

  <ellipse cx="52" cy="80.3" rx="31.5" ry="8.1"
    fill="#9EE6FF" fill-opacity="0.18"/>

  <!-- squat body: deliberately wider and shorter -->
  <path d="M34 45
           C39 50 39 55 33 61
           C27 67 24 72 26 77
           C29 82 38 85 52 85
           C66 85 75 82 78 77
           C80 72 77 67 71 61
           C65 55 65 50 70 45
           Z"
        fill="url(#body)" stroke="#06366E" stroke-width="1.6"/>

  <!-- front highlight -->
  <path d="M31 65
           C36 56 40 51 44 47"
        stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="5.4"
        stroke-linecap="round"/>

  <!-- neck shadow -->
  <ellipse cx="52" cy="48.5" rx="15" ry="6.3"
    fill="#0B4F9F" fill-opacity="0.52"/>

  <!-- large low-set head for stronger screen-facing perspective -->
  <circle cx="52" cy="31.5" r="20.5"
    fill="url(#head)" stroke="#06366E" stroke-width="1.6"/>

  <ellipse cx="43.8" cy="23.8" rx="7.2" ry="4.5"
    fill="#FFFFFF" fill-opacity="0.58"/>

  <path d="M35 31
           C37 21 44 14 54 12"
        stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"
        stroke-linecap="round"/>

  <!-- subtle lower-front reflection -->
  <path d="M26 89
           C37 94 66 95 79 89"
        stroke="#9EE6FF" stroke-opacity="0.17" stroke-width="2.2"
        stroke-linecap="round"/>
</svg>