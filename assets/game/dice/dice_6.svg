<svg width="128" height="128" viewBox="0 0 128 128" fill="none"
xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="26" y1="20" x2="101" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.30" stop-color="#FCFCFF"/>
      <stop offset="0.70" stop-color="#E8EAF1"/>
      <stop offset="1" stop-color="#C6CBD7"/>
    </linearGradient>
    <linearGradient id="edge" x1="24" y1="24" x2="103" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#EEF2F8"/>
      <stop offset="1" stop-color="#9DA7B8"/>
    </linearGradient>
    <radialGradient id="pipGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(60 58) rotate(45) scale(15)">
      <stop offset="0" stop-color="#173E74"/>
      <stop offset="0.52" stop-color="#081A35"/>
      <stop offset="1" stop-color="#020812"/>
    </radialGradient>
    <linearGradient id="shine" x1="37" y1="26" x2="94" y2="89" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.95"/>
      <stop offset="0.44" stop-color="white" stop-opacity="0.12"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="8" y="8" width="112" height="116" filterUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#00152E" flood-opacity="0.34"/>
    </filter>
    <filter id="softGlow" x="11" y="11" width="106" height="106" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- soft contact shadow -->
  <ellipse cx="64" cy="108" rx="35" ry="8" fill="#07172B" fill-opacity="0.16"/>

  <g filter="url(#shadow)">
    <!-- bevel / outer shell -->
    <rect x="20" y="16" width="88" height="88" rx="24" fill="url(#edge)"/>
    <rect x="23" y="19" width="82" height="82" rx="21" fill="url(#body)" stroke="white" stroke-width="2"/>

    <!-- subtle bottom depth -->
    <path d="M28 91C35 99 43 102 55 102H86C96 102 103 95 105 86V89C105 99 97 107 87 107H43C32 107 23 98 23 87V79C24 84 25 88 28 91Z"
      fill="#9EA7B6" fill-opacity="0.44"/>

    <!-- top glossy plane -->
    <path d="M36 25H85C95 25 101 31 102 40C84 30 53 27 29 43C31 33 33 28 36 25Z"
      fill="url(#shine)"/>
    <path d="M34 27C49 22 78 21 94 31" stroke="white" stroke-opacity="0.78"
      stroke-width="4" stroke-linecap="round"/>

  <g>
    <circle cx="43" cy="39.5" r="7.6" fill="#07172B" fill-opacity="0.42"/>
    <circle cx="43" cy="38" r="7.2" fill="url(#pipGrad)"/>
    <ellipse cx="40.8" cy="35.5" rx="2.3" ry="1.7" fill="white" fill-opacity="0.48"/>
  </g>
  <g>
