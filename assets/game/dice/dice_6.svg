    <circle cx="43" cy="64" r="7.2" fill="url(#pipGrad)"/>
    <ellipse cx="40.8" cy="61.5" rx="2.3" ry="1.7" fill="white" fill-opacity="0.48"/>
  </g>
  <g>
    <circle cx="85" cy="65.5" r="7.6" fill="#07172B" fill-opacity="0.42"/>
    <circle cx="85" cy="64" r="7.2" fill="url(#pipGrad)"/>
    <ellipse cx="82.8" cy="61.5" rx="2.3" ry="1.7" fill="white" fill-opacity="0.48"/>
  </g>
  <g>
    <circle cx="43" cy="91.5" r="7.6" fill="#07172B" fill-opacity="0.42"/>
    <circle cx="43" cy="90" r="7.2" fill="url(#pipGrad)"/>
    <ellipse cx="40.8" cy="87.5" rx="2.3" ry="1.7" fill="white" fill-opacity="0.48"/>
  </g>
  <g>
